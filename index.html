<head>

<title>ST. ALi Menu</title>
<meta name="description" content="ST. ALi visual menu">
<style>
/* ST. ALi visual menu prototype v2.
   Layout: fixed header, a fixed stage holding a single centred rail, native scroll drives card scale.
   Colours and bag settings are in CONFIG at the top of the script. */
:root{
  --ground:#7E521B; --cream:#F7F2EA; --ink:#000; --white:#fff;
  --sans:"Helvetica Neue","HelveticaNeue",Helvetica,Arial,sans-serif;
  --col:430px; --tabs-h:38px; --acts-h:48px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-weight:700;-webkit-font-smoothing:antialiased;transition:background-color .45s ease;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#spacer{width:1px}
#stage{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#stage .slot{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:auto}

/* header */
#bar{position:fixed;left:0;right:0;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--ground);transition:background-color .45s ease}
#bar .in{width:100%}
#tabs{display:flex;height:39px}
#tabs button{flex:1 0 auto;padding:0 6px;font-size:20px;line-height:39px;letter-spacing:-.02em;text-align:left;white-space:nowrap;transition:flex-grow .4s ease}
#tabs button.on{flex-grow:4}
#acts{display:flex;justify-content:space-between;align-items:center;height:var(--acts-h);padding:5px}
#acts .grp{display:flex;gap:10px}
.ic{width:38px;height:38px;display:grid;place-items:center;position:relative;touch-action:manipulation}
.ic svg{width:28px;height:28px;display:block;overflow:visible}
.ic svg path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;transition:fill .15s ease}
.ic.heart[aria-pressed="true"] svg path{fill:var(--ink)}
.ic.heart.pop svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
#navHeart .n{position:absolute;right:-2px;top:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:var(--white);font-size:10px;line-height:16px;text-align:center}
#navHeart .n:empty{display:none}

/* rail objects */
.card{width:var(--cw);border-radius:15px;padding:13px;background:var(--cream);display:flex;flex-direction:column;gap:7px;touch-action:manipulation}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:24px;line-height:1.15;letter-spacing:-.01em}
.card h2{font:inherit;margin:0;min-width:0}
.card .ph{position:relative;width:100%;aspect-ratio:346/456;overflow:hidden;background:#e8e2da}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.card .burst{position:absolute;left:50%;top:50%;width:38%;margin:-19% 0 0 -19%;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 12px rgba(0,0,0,.25))}
.card .burst path{fill:var(--white)}
.card .burst.go{animation:burst .8s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scale(.2)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.card .desc,.card .adds,.card .diet{font-weight:400;font-size:12px;line-height:1.2}
.card .adds{display:grid;grid-template-columns:1fr auto;column-gap:10px}
.card .acts{display:flex;justify-content:space-between;margin:0 -5px -5px}

.mast{width:var(--cw);min-height:calc(var(--cw) * 1.1);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;text-align:center}
.mast .t,.quote .t,.foot .t{font-size:calc(var(--cw) * .145);line-height:1;letter-spacing:-.02em;margin:0}
.mast .s,.quote .s,.foot .s{font-size:12px;line-height:1;letter-spacing:-.02em;margin:0}
.quote{width:var(--cw);display:flex;flex-direction:column;gap:7px;text-align:center;padding:10px 0}
.quote .s,.foot .s{font-weight:400}
.bag{width:var(--cw);display:flex;justify-content:center}
.bag canvas{width:88%;height:auto;display:block}
.foot{width:var(--colw);display:flex;flex-direction:column;gap:7px;text-align:center;padding:20px 0 calc(40px + env(safe-area-inset-bottom,0px))}
.foot .t{font-size:54px}

/* list sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-end;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s ease}
#sheet.open{opacity:1;pointer-events:auto}
#sheet .panel{width:100%;max-width:var(--col);max-height:88%;display:flex;flex-direction:column;background:var(--cream);border-radius:15px 15px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open .panel{transform:none}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:13px 13px 6px;font-size:24px;letter-spacing:-.01em}
#sheet .hd button{font-size:12px}
#sheet ul{list-style:none;margin:0;padding:0 13px;overflow:auto;flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;align-content:start}
#sheet li{aspect-ratio:1/1}
#sheet li button{display:block;width:100%;height:100%}
#sheet li img{width:100%;height:100%;object-fit:cover;display:block}
#sheet .note{padding:4px 13px 0;font-size:14px;line-height:1.2;letter-spacing:-.01em}
#sheet .empty{grid-column:1/-1;aspect-ratio:auto!important;padding:24px 0 40px;font-weight:400;font-size:14px;line-height:1.3}
#sheet .ft{display:flex;gap:10px;padding:13px}
#sheet .ft button{flex:1;height:48px;border-radius:24px;background:var(--ink);color:var(--white);font-size:14px}
#sheet .ft button.alt{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:20px;background:var(--ink);color:var(--white);font-size:13px;transition:opacity .2s ease,transform .2s ease;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* desktop cover */
#cover{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:var(--ground);padding:40px;text-align:center}
#cover.on{display:flex}
#cover .in{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:900px}
#cover .t{font-size:clamp(54px,9vw,150px);line-height:1;letter-spacing:-.03em;margin:0}
#cover .m{font-size:clamp(20px,2.2vw,32px);line-height:1.05;letter-spacing:-.02em;margin:0;max-width:26ch}
#qr{width:168px;height:168px;padding:12px;background:var(--cream);border-radius:15px}
#qr img,#qr canvas{width:144px!important;height:144px!important;display:block}
#cover .u{font-weight:400;font-size:12px}
#cover button{font-size:12px;text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion: reduce){
  body,#bar,#sheet,#sheet .panel,#toast{transition:none}
  .ic.heart.pop svg,.card .burst.go{animation:none}
}
</style>

/* ---------- setup ---------- */
const COL = CONFIG.colours;
document.querySelectorAll('#tabs button').forEach(b => { b.style.backgroundColor = COL[b.dataset.sec]; });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MIN = 0.30, WIDTH = 1.0, GAP = 16, STEP = 340, LERP = reduce ? 1 : 0.2;
const params = new URLSearchParams(location.search);
const VENUE = params.get('v') || '';
const BASE = location.origin + location.pathname + (VENUE ? '?v=' + encodeURIComponent(VENUE) : '');
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
ITEMS.forEach(it => it.id = slug(it.name));
const BYID = Object.fromEntries(ITEMS.map(it => [it.id, it]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C12 20.5 4.5 16 2.6 11.2C1.4 8 3.4 4.5 7 4.5C9.1 4.5 10.8 5.8 12 7.6C13.2 5.8 14.9 4.5 17 4.5C20.6 4.5 22.6 8 21.4 11.2C19.5 16 12 20.5 12 20.5Z"/></svg>';
const SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 2.5L2.5 9.6L10.1 13.1L13.6 20.9Z M21.5 2.5L10.1 13.1"/></svg>';

/* ---------- analytics hook ----------
   Sends named events to Plausible or Umami if either script is added to the page. Does nothing otherwise.
   Events: view, save, unsave, share_item, share_menu, share_list, list_open, list_import */
function track(name, props){
  props = Object.assign({venue: VENUE || 'none'}, props || {});
  try{
    if (window.plausible) window.plausible(name, {props});
    else if (window.umami && window.umami.track) window.umami.track(name, props);
  }catch(e){}
}

/* ---------- saved list (stored on the device) ---------- */
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storageKey)) || []; }catch(e){ return []; } },
  set(a){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(a)); }catch(e){} }
};
let saved = store.get().filter(id => BYID[id]);
function isSaved(id){ return saved.includes(id); }
function setSaved(id, on, source){
  if (on === isSaved(id)) return;
  saved = on ? saved.concat(id) : saved.filter(x => x !== id);
  store.set(saved);
  document.querySelectorAll('.ic.heart[data-id="'+id+'"]').forEach(b => {
    b.setAttribute('aria-pressed', on);
    if (on && !reduce){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  });
  updateNavCount();
  if (on && navigator.vibrate) navigator.vibrate(8);
  track(on ? 'save' : 'unsave', {item:id, source});
}
function updateNavCount(){ document.querySelector('#navHeart .n').textContent = saved.length || ''; }

/* ---------- share ---------- */
async function share(url, title, event, props){
  track(event, props);
  if (navigator.share){ try{ await navigator.share({title, url}); }catch(e){} return; }
  try{ await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch(e){ toast(url); }
}
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- rail contents ---------- */
const RAIL = [{type:'mast', sec:'coffee'}];
const seenSec = {};
ITEMS.forEach(it => {
  if (!seenSec[it.sec]){ seenSec[it.sec]=1; CONFIG.quotes.filter(q=>q.sec===it.sec).forEach(q=>RAIL.push({type:'quote', sec:it.sec, q})); }
  RAIL.push({type:'card', sec:it.sec, it});
  if (it.name === CONFIG.bag.after) RAIL.push({type:'bag', sec:it.sec});
});
RAIL.push({type:'foot', sec: ITEMS[ITEMS.length-1].sec});

const stage = document.getElementById('stage');
const slots = [];
let bagFirst = null, bagFrames = [], bagCtx = null, bagIdx = -1;

function cardHTML(it){
  const adds = it.adds.length ? '<div class="adds">'+it.adds.map(a=>'<span>'+esc(a[0])+'</span><span>'+esc(a[1])+'</span>').join('')+'</div>' : '';
  return '<article class="card" id="'+it.id+'">'
    +'<div class="row"><h2>'+esc(it.name)+'</h2><span>'+esc(it.price)+'</span></div>'
    +'<div class="ph"><img alt="'+esc(it.name)+'" src="'+it.img+'" draggable="false"><svg class="burst" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C12 20.5 4.5 16 2.6 11.2C1.4 8 3.4 4.5 7 4.5C9.1 4.5 10.8 5.8 12 7.6C13.2 5.8 14.9 4.5 17 4.5C20.6 4.5 22.6 8 21.4 11.2C19.5 16 12 20.5 12 20.5Z"/></svg></div>'
    +(it.desc?'<div class="desc">'+esc(it.desc)+'</div>':'')+adds
    +(it.diet?'<div class="diet">'+esc(it.diet)+'</div>':'')
    +'<div class="acts"><button type="button" class="ic heart" data-id="'+it.id+'" aria-pressed="'+isSaved(it.id)+'" aria-label="Add '+esc(it.name)+' to favourites">'+HEART+'</button>'
    +'<button type="button" class="ic share" data-id="'+it.id+'" aria-label="Share '+esc(it.name)+'">'+SHARE+'</button></div>'
    +'</article>';
}

function build(){
  RAIL.forEach((r, i) => {
    if (r.type === 'bag' && !bagFirst) return;
    const el = document.createElement('div'); el.className='slot';
    if (r.type==='mast') el.innerHTML='<div class="mast"><p class="t">'+esc(CONFIG.masthead.title)+'</p><p class="s">'+esc(CONFIG.masthead.sub)+'</p></div>';
    if (r.type==='quote') el.innerHTML='<div class="quote"><p class="t">'+esc(r.q.text)+'</p><p class="s">'+esc(r.q.by)+'</p></div>';
    if (r.type==='card') el.innerHTML=cardHTML(r.it);
    if (r.type==='foot') el.innerHTML='<button type="button" class="foot"><span class="t">BACK TO<br>THE TOP</span><span class="s">WHERE YOU BELONG</span></button>';
    if (r.type==='bag'){
      el.innerHTML='<div class="bag" role="img" aria-label="ST. ALi Star Wars coffee bag"><canvas></canvas></div>';
      const c = el.querySelector('canvas'); c.width=bagFirst.naturalWidth; c.height=bagFirst.naturalHeight;
      bagCtx = c.getContext('2d'); bagCtx.drawImage(bagFirst,0,0); bagIdx=0;
    }
    const s = {el, r, s: r.type==='foot' ? 1 : MIN, idx: slots.length};
    slots.push(s); stage.appendChild(el);
    wire(s);
  });
}

/* ---------- interaction ---------- */
let curF = 0;
const focusIdx = () => Math.round(curF);
function go(i, smooth){ scrollTo({top:i*STEP, behavior:(smooth && !reduce)?'smooth':'auto'}); }

function wire(s){
  const {el, r} = s;
  // A tap on any object away from the focal line scrolls it into focus first.
  el.addEventListener('click', e => {
    if (r.type==='foot' || s.idx===focusIdx()) return;
    e.preventDefault(); e.stopPropagation(); go(s.idx, true);
  }, true);
  if (r.type==='foot') el.querySelector('.foot').addEventListener('click', ()=>go(0, true));
  if (r.type!=='card') return;
  const id = r.it.id;
  el.querySelector('.ic.heart').addEventListener('click', ()=>setSaved(id, !isSaved(id), 'icon'));
  el.querySelector('.ic.share').addEventListener('click', ()=>share(BASE+'#'+id, r.it.name+' at ST. ALi', 'share_item', {item:id}));
  // Double tap on the photo saves (it does not remove), as on Instagram.
  const ph = el.querySelector('.ph'), burst = el.querySelector('.burst');
  let last = 0;
  ph.addEventListener('pointerup', () => {
    if (s.idx !== focusIdx()) return;
    const now = performance.now();
    if (now - last < 320){
      last = 0;
      setSaved(id, true, 'double_tap');
      if (!reduce){ burst.classList.remove('go'); void burst.offsetWidth; burst.classList.add('go'); }
    } else last = now;
  });
}

document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
  const i = slots.findIndex(s => s.r.sec===b.dataset.sec && s.r.type!=='mast');
  const first = slots.findIndex(s => s.r.sec===b.dataset.sec);
  go(b.dataset.sec==='coffee' ? 0 : (first>=0?first:i), true);
}));
document.getElementById('navShare').addEventListener('click', ()=>share(BASE, 'ST. ALi menu', 'share_menu'));
document.getElementById('navHeart').addEventListener('click', ()=>openSheet('own'));

/* ---------- list sheet ---------- */
const sheet = document.getElementById('sheet');
let sharedIds = [];
function openSheet(mode){
  const own = mode==='own';
  const ids = own ? saved : sharedIds;
  document.getElementById('sheetTitle').textContent = own ? 'FAVOURITES' : 'SHARED FAVOURITES';
  const ul = document.getElementById('sheetList');
  ul.innerHTML = ids.length ? ids.map(id => { const it=BYID[id];
    return '<li><button type="button" data-go="'+id+'" aria-label="'+esc(it.name)+'"><img src="'+it.img+'" alt=""></button></li>'; }).join('')
    : '';
  if (!ids.length) ul.innerHTML = '<li class="empty">Tap the heart on any dish to add it to your favourites.</li>';
  const ft = document.getElementById('sheetFt');
  ft.innerHTML = own ? (ids.length ? '<button type="button" id="shareList">SHARE FAVOURITES</button>' : '')
                     : '<button type="button" id="importList">ADD TO MY FAVOURITES</button>';
  ft.style.display = ft.innerHTML ? '' : 'none';
  document.getElementById('sheetNote').style.display = (own && ids.length) ? '' : 'none';
  ul.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const i = slots.findIndex(s => s.r.it && s.r.it.id===b.dataset.go); closeSheet(); go(i, false);
  }));
  const sl = document.getElementById('shareList');
  if (sl) sl.addEventListener('click', ()=>share(BASE+(VENUE?'&':'?')+'list='+saved.join(','), 'My ST. ALi favourites', 'share_list', {count:saved.length}));
  const il = document.getElementById('importList');
  if (il) il.addEventListener('click', () => { sharedIds.forEach(id=>setSaved(id,true,'shared_list')); track('list_import',{count:sharedIds.length}); openSheet('own'); });
  sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false');
  document.getElementById('sheetClose').focus({preventScroll:true});
  if (own) track('list_open', {count:ids.length});
}
function closeSheet(){ sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); }
document.getElementById('sheetClose').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if (e.target===sheet) closeSheet(); });
addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });

/* ---------- rail motion ---------- */
let vw=0, vh=0, top0=0, colW=0, x0=0, cw=0, H=[];
function measure(){
  vw = innerWidth; vh = innerHeight;
  colW = Math.min(vw, CONFIG.colMax); x0 = (vw - colW)/2;
  top0 = document.getElementById('bar').getBoundingClientRect().bottom;
  cw = Math.min(colW - 30, 420);
  document.documentElement.style.setProperty('--cw', cw+'px');
  document.documentElement.style.setProperty('--colw', colW+'px');
  slots.forEach(s => { s.el.style.transform='none'; });
  H = slots.map(s => s.el.firstElementChild.offsetHeight);
  document.getElementById('spacer').style.height = ((slots.length-1)*STEP + vh) + 'px';
}
function target(i,f){ const d=(i-f)/WIDTH; return MIN + (1-MIN)*Math.exp(-d*d); }

let curSec = null, dwellIdx = -1, dwellT = 0;
const viewed = new Set();
function setSection(sec){
  if (sec===curSec) return; curSec = sec;
  document.documentElement.style.setProperty('--ground', COL[sec]);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.sec===sec));
}
function frame(now){
  const f = Math.max(0, Math.min(slots.length-1, scrollY/STEP)); curF = f;
  slots.forEach((s,i) => { if (s.r.type==='foot'){ s.s=1; return; } const t=target(i,f); const n=s.s+(t-s.s)*LERP; s.s=Math.abs(t-n)<0.0005?t:n; });
  const hs = slots.map((s,i) => H[i]*s.s);
  const tops=[]; let y=0; hs.forEach(h => { tops.push(y); y+=h+GAP; });
  const k=Math.floor(f), t=f-k, k2=Math.min(k+1,slots.length-1);
  const cA=tops[k]+hs[k]/2, cB=tops[k2]+hs[k2]/2;
  const anchor = cA+(cB-cA)*t;
  const focal = top0 + (vh-top0)*0.46;
  const off = focal - anchor;
  slots.forEach((s,i) => {
    const w = s.r.type==='foot' ? colW : cw*s.s;
    const x = x0 + (colW - w)/2, yy = off+tops[i];
    const vis = !(yy>vh+40 || yy+hs[i]<-40);
    s.vis = vis;
    if (!vis){ s.el.style.visibility='hidden'; return; }
    s.el.style.visibility='visible';
    s.el.style.transform='translate3d('+x.toFixed(1)+'px,'+yy.toFixed(1)+'px,0) scale('+s.s.toFixed(4)+')';
  });
  setSection(slots[Math.round(f)].r.sec);
  // Count a view when a card holds the focal line for a second.
  const fi = Math.round(f);
  if (fi!==dwellIdx){ dwellIdx=fi; dwellT=now; }
  else if (now-dwellT>1000){ const r=slots[fi].r; if (r.type==='card' && !viewed.has(r.it.id)){ viewed.add(r.it.id); track('view',{item:r.it.id}); } }
  spin(now);
  requestAnimationFrame(frame);
}

/* ---------- spinning bag ---------- */
function bagSrc(n){ const b=CONFIG.bag; return b.path + String(b.first+n).padStart(b.digits,'0') + '.' + b.ext; }
function loadBagFrames(){
  bagFrames[0] = bagFirst;
  let n = 1;
  const next = () => { if (n >= CONFIG.bag.count) return; const i=n++; const img=new Image(); img.onload=()=>{bagFrames[i]=img; next();}; img.onerror=next; img.src=bagSrc(i); };
  for (let k=0;k<4;k++) next();
}
function spin(now){
  if (!bagCtx || reduce || !bagSpins) return;
  const s = slots.find(x => x.r.type==='bag'); if (!s || !s.vis) return;
  let i = Math.floor(now * CONFIG.bag.fps / 1000) % CONFIG.bag.count;
  while (i>0 && !bagFrames[i]) i--;
  if (i===bagIdx || !bagFrames[i]) return;
  bagIdx = i; bagCtx.clearRect(0,0,bagCtx.canvas.width,bagCtx.canvas.height); bagCtx.drawImage(bagFrames[i],0,0);
}

/* ---------- desktop cover ---------- */
const cover = document.getElementById('cover');
function checkCover(){
  let skip = false; try{ skip = sessionStorage.getItem('stali_cover_skip')==='1'; }catch(e){}
  const on = innerWidth >= CONFIG.coverMinWidth && !skip;
  cover.classList.toggle('on', on); cover.setAttribute('aria-hidden', String(!on));
  document.body.style.overflow = on ? 'hidden' : '';
  if (on && !cover.dataset.qr){
    const url = BASE;
    document.getElementById('coverUrl').textContent = url.replace(/^https?:\/\//,'');
    const draw = () => { if (!window.QRCode) return false; new QRCode(document.getElementById('qr'), {text:url, width:144, height:144, colorDark:'#000000', colorLight:'#F7F2EA', correctLevel:QRCode.CorrectLevel.M}); cover.dataset.qr='1'; return true; };
    if (!draw()) addEventListener('load', () => { if (!draw()) document.getElementById('qr').style.display='none'; });
  }
}
document.getElementById('coverAnyway').addEventListener('click', () => { try{ sessionStorage.setItem('stali_cover_skip','1'); }catch(e){} checkCover(); });

/* ---------- start ---------- */
function start(){
  build(); updateNavCount(); measure();
  setSection('coffee');
  const h = location.hash.slice(1);
  const hi = h ? slots.findIndex(s => s.r.it && s.r.it.id===h) : -1;
  if (hi>0) go(hi, false);
  if (bagSpins && !reduce) setTimeout(loadBagFrames, 800);
  const list = params.get('list');
  if (list){ sharedIds = list.split(',').filter(id=>BYID[id]); if (sharedIds.length) openSheet('shared'); }
  addEventListener('resize', () => { measure(); checkCover(); });
  checkCover();
  requestAnimationFrame(frame);
}
// Look for the first bag frame. If it is not there, the rail is built without the bag.
// Look for the first bag frame, then a still image. If neither is there, the rail is built without the bag.
let bagSpins = false;
function probe(src){ return new Promise(res => { const img=new Image(); const t=setTimeout(()=>res(null),2500); img.onload=()=>{clearTimeout(t);res(img);}; img.onerror=()=>{clearTimeout(t);res(null);}; img.src=src; }); }
(async function(){
  let img = await probe(bagSrc(0));
  if (img) bagSpins = true; else img = await probe(CONFIG.bag.still);
  bagFirst = img; start();
})();
</script>
